<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emploi du temps UCA</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="center" id="boot" hidden>
  <img class="app-logo" src="icons/icon-192.png" alt="">
  <p class="muted">Ouverture…</p>
</main>
<main id="gate" hidden>
  <img class="app-logo" src="icons/icon-192.png" alt="">
  <h1>Emploi du temps UCA</h1>
  <p class="lead">Que veux-tu faire ?</p>
  <div class="card">
    <h2>Accéder à l'agenda en ligne</h2>
    <p>Ouvre ton emploi du temps, tes notes et tes lieux directement dans ce navigateur.</p>
    <button class="btn primary" id="gateAgenda" type="button">Ouvrir l'agenda en ligne</button>
  </div>
  <div class="card">
    <h2>Consulter la page</h2>
    <p>Découvre l'appli, l'installer sur ton téléphone ou ton ordinateur.</p>
    <a class="btn" id="gatePage" href="../appli.html">Voir la page de présentation</a>
  </div>
</main>
<script src="../core/env.js"></script>
<script>
/* Aiguillage : guide d'installation (première visite dans le navigateur), choix du design,
   puis la coque de l'app (onglets comme l'app Android ; les paramètres de raccourci sont transmis à l'agenda). */
(async function () {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  // Ouverture du lien dans un navigateur, sans rien d'autre : on demande d'abord « consulter la page » ou « agenda en ligne »,
  // avant d'afficher quoi que ce soit. Pas de question dans l'appli installée, dans un cadre, avec un raccourci (?view=, ?open=, ?source=…)
  // ni une fois le choix fait dans cet onglet.
  let asked = false; try { asked = sessionStorage.getItem("uca_app_go") === "1"; } catch (e) { /* stockage indisponible */ }
  if (!standalone && window.top === window && !location.search && !asked) {
    const gate = document.getElementById("gate"); gate.hidden = false;
    document.getElementById("gateAgenda").onclick = () => { try { sessionStorage.setItem("uca_app_go", "1"); } catch (e) { /* ignoré */ } location.reload(); };
    document.getElementById("gateAgenda").focus();
    return;
  }
  document.getElementById("boot").hidden = false;
  const [{ uca_design }, designs] = await Promise.all([chrome.storage.local.get("uca_design"), fetch(chrome.runtime.getURL("designs/designs.json")).then((r) => r.json())]);
  // Design déjà choisi sur cet appareil : il a déjà servi, jamais revoir le guide d'installation
  // (y compris dans une fenêtre "application" classique où le mode standalone n'est pas détecté).
  if (uca_design) localStorage.setItem("uca_install_seen", "1");
  if (!standalone && !uca_design && !localStorage.getItem("uca_install_seen")) { location.replace("install.html"); return; }
  const design = designs.find((d) => d.id === uca_design);
  if (!design) { location.replace(chrome.runtime.getURL("choose.html?tab=1")); return; }
  // Même app que l'APK Android : barre du bas Accueil / Études / Agenda / Lieux / Compte (app/shell.html).
  // Déjà dans l'onglet Agenda de la coque (cadre) : agenda directement, jamais une coque dans la coque.
  if (window.top !== window) { location.replace(chrome.runtime.getURL(`${design.folder}/agenda.html`) + location.search.replace(/[?&]source=pwa/, "").replace(/^&/, "?")); return; }
  location.replace("shell.html" + location.search);
})();
</script>
</body>
</html>
