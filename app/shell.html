<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://odin.iut.uca.fr https://ent.uca.fr https://moodle.uca.fr https://mail.uca.fr https://kiricoucou.github.io https://raw.githubusercontent.com; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My UCA</title>
<link rel="manifest" href="../app.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="backBtn" hidden aria-label="Retour"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="topbarTitle">Accueil</h1>
    <button class="icon-btn" id="bellBtn" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1112 0v5l2 2H4zM10 20a2 2 0 004 0"/></svg><span class="dot" id="bellDot" hidden></span></button>
    <button class="icon-btn" id="personBtn" aria-label="Mon compte"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg></button>
  </header>
  <div class="session-banner" id="sessionBanner" hidden>Données anciennes ou session expirée : <a href="import.html">réimporte tes données</a>.</div>
  <main id="screen" tabindex="-1"></main>
  <iframe id="agendaFrame" title="Agenda" hidden></iframe>
  <nav class="bottom-nav" id="bottomNav" aria-label="Navigation principale">
    <div class="side-brand"><img src="icons/icon-192.png" alt="">My UCA</div>
    <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg><span>Accueil</span></button>
    <button data-tab="etudes"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5zM6 11v5c3 3 9 3 12 0v-5"/></svg><span>Études</span></button>
    <button data-tab="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Agenda</span></button>
    <button data-tab="lieux"><svg viewBox="0 0 24 24"><path d="M12 22s7-7 7-12a7 7 0 10-14 0c0 5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Lieux</span></button>
    <button data-tab="compte"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg><span>Compte</span></button>
  </nav>
</div>
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="../core/env.js"></script>
<script src="../core/settings.js"></script>
<script src="../core/status.js"></script>
<script src="../vendor/qrcode.js"></script>
<script src="../core/transfer.js"></script>
<script src="shell.js"></script>
</body>
</html>
