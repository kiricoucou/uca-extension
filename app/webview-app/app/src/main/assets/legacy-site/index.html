<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emploi du temps UCA</title>
<link rel="icon" type="image/png" href="icon-512.png">
<script>
  (function() {
    var design = 'anime';
    try {
      var store = JSON.parse(localStorage.getItem('uca_store') || '{}');
      design = store.uca_design || localStorage.getItem('uca_design') || 'anime';
    } catch(e){}
    var q = location.search;
    var hash = location.hash;
    location.replace('designs/' + design + '/agenda.html' + q + hash);
  })();
</script>
<style>
  body {
    background: #121418;
    color: #f2f3f5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .spinner {
    width: 40px;
    height: 40px;
    border: 3.5px solid rgba(24, 183, 176, 0.2);
    border-top-color: #18b7b0;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="spinner"></div>
  <p style="margin-top: 16px; font-weight: 700; color: #9aa0ab; font-size: 14px;">Ouverture de ton emploi du temps UCA…</p>
</body>
</html>
