<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Carte des Campus UCA</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #map { width: 100%; height: 100%; background: #121418; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .leaflet-tile { filter: brightness(0.78) invert(1) contrast(3) hue-rotate(200deg) saturate(0.35); }
  .leaflet-container { background: #121418 !important; }
  .campus-popup .leaflet-popup-content-wrapper {
    background: #1e2229;
    color: #f2f3f5;
    border: 1px solid #2d3340;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .campus-popup .leaflet-popup-tip { background: #1e2229; }
  .pop-title { font-size: 13.5px; font-weight: 800; color: #00bfa5; margin-bottom: 2px; }
  .pop-sub { font-size: 11px; color: #94a3b8; margin-bottom: 6px; }
  .pop-badge { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .pop-badge.open { background: rgba(47,214,143,0.15); color: #2fd68f; border: 1px solid rgba(47,214,143,0.3); }
  .pop-badge.closed { background: rgba(248,113,113,0.15); color: #f87171; border: 1px solid rgba(248,113,113,0.3); }
  .pop-link { display: block; font-size: 11px; color: #38bdf8; text-decoration: none; font-weight: 700; margin-top: 6px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const CAMPUS_PLACES = [
    { nom: "BU Cézeaux (Sciences & Tech)", lat: 45.7595, lon: 3.1118, type: "bu", ouvert: true, desc: "Campus des Cézeaux · 8h - 20h" },
    { nom: "Resto U Marie-Hélène Lafon", lat: 45.7608, lon: 3.1132, type: "resto", ouvert: true, desc: "Cézeaux Aubière · 11h30 - 13h45 (62% occupé)" },
    { nom: "IUT Aubière (Informatique)", lat: 45.7582, lon: 3.1124, type: "campus", ouvert: true, desc: "Campus Cézeaux · Département Info & Réseaux" },
    { nom: "ISIMA (École d'Ingénieurs)", lat: 45.7610, lon: 3.1105, type: "campus", ouvert: true, desc: "Campus Cézeaux · Bât. Blaise Pascal" },
    { nom: "SIGMA Clermont", lat: 45.7578, lon: 3.1145, type: "campus", ouvert: true, desc: "Campus Cézeaux · Pôle Chimie/Méca" },
    { nom: "BU Lettres & SHS Gergovia", lat: 45.7702, lon: 3.0888, type: "bu", ouvert: true, desc: "Site Gergovia · 8h30 - 19h30" },
    { nom: "Resto U Le Manège Carnot", lat: 45.7725, lon: 3.0902, type: "resto", ouvert: true, desc: "Centre-ville Carnot · 11h30 - 13h45 (85% occupé)" },
    { nom: "Droit-Éco (Site Carnot)", lat: 45.7731, lon: 3.0895, type: "campus", ouvert: true, desc: "Bd Mitterrand · Site Carnot" },
    { nom: "Santé & Pharmacie Dunant", lat: 45.7685, lon: 3.0945, type: "campus", ouvert: true, desc: "Campus Dunant · 8h - 19h" },
    { nom: "Resto U Le Dunant", lat: 45.7680, lon: 3.0950, type: "resto", ouvert: true, desc: "Campus Dunant · Resto U Médecine" },
    { nom: "Odontologie (Dentaire)", lat: 45.7820, lon: 3.1020, type: "campus", ouvert: false, desc: "Clermont-Ferrand · Réouverture 14h" },
    { nom: "INSPÉ Chamalières", lat: 45.7780, lon: 3.0650, type: "campus", ouvert: false, desc: "Campus Chamalières" }
  ];

  let map;
  function init() {
    map = L.map('map', {
      zoomControl: true,
      attributionControl: false
    }).setView([45.765, 3.100], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    CAMPUS_PLACES.forEach(p => {
      const badgeCls = p.ouvert ? "open" : "closed";
      const badgeTxt = p.ouvert ? "OUVERT" : "FERMÉ";
      const iconEmoji = p.type === "bu" ? "📚" : p.type === "resto" ? "🍽️" : "🎓";
      const iconHtml = `<div style="background:#00bfa5;color:#121418;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,0.5);border:2px solid #ffffff;">${iconEmoji}</div>`;
      
      const customIcon = L.divIcon({
        html: iconHtml,
        className: 'custom-pin',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      const popupHtml = `
        <div class="pop-title">${p.nom}</div>
        <div class="pop-sub">${p.desc}</div>
        <span class="pop-badge ${badgeCls}">${badgeTxt}</span>
        <a class="pop-link" href="https://maps.google.com/?q=${p.lat},${p.lon}" target="_blank">Itinéraire Google Maps ↗</a>
      `;

      L.marker([p.lat, p.lon], { icon: customIcon })
        .addTo(map)
        .bindPopup(popupHtml, { className: 'campus-popup' });
    });

    // Invalider la taille après le premier rendu pour garantir la netteté immédiate
    setTimeout(() => { map.invalidateSize(); }, 150);
  }

  window.addEventListener('load', init);
  window.addEventListener('resize', () => { if (map) map.invalidateSize(); });
</script>
</body>
</html>
