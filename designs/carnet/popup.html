<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon carnet — Emploi du temps UCA</title>
<link rel="icon" type="image/png" href="icons/icon32.png">
<style>
:root{
  color-scheme:light;
  --bg:#f6f0e1;
  --surface:#fffaf0;
  --surface-2:#f3ead6;
  --surface-3:#e9dcc0;
  --border:#e2d5b8;
  --border-strong:#c9b68f;
  --text:#2d2a26;
  --text-dim:#6e6658;
  --accent:#2f4fa2;
  --accent2:#2f4fa2;
  --accent-hover:#26418a;
  --accent-light:#dfe6f7;
  --accent-tint:#eef2fb;
  --on-accent:#ffffff;
  --link:#2f4fa2;
  --danger:#c0392b;
  --danger-solid:#c0392b;
  --danger-bright:#c0392b;
  --danger-bg:#f9e1dc;
  --success:#2e7d32;
  --success-bg:#e3f1df;
  --success-solid:#2e7d32;
  --warn-bg:#7a4f01;
  --live:#c0392b;
  --on-color:#2d2a26;
  --toast-bg:#2d2a26;
  --toast-text:#fffaf0;
  --shadow:0 1px 2px rgba(80,60,20,.16),0 2px 6px rgba(80,60,20,.08);
  --shadow-lg:0 6px 18px rgba(80,60,20,.18),0 1px 3px rgba(80,60,20,.2);
  --radius:14px;
  --radius-sm:10px;
  --font:"Nunito","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);font-size:14px;line-height:1.43;
  background:var(--bg);color:var(--text);
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
}
::selection{background:var(--accent-light);color:var(--text);}
*:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
::-webkit-scrollbar{width:12px;height:12px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:3px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim);}
*{scrollbar-color:var(--border) transparent;}
a{color:var(--link);text-underline-offset:2px;}

.ic{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px;}
.ic.sm{width:16px;height:16px;vertical-align:-3px;}
button .ic+span,button .ic~*{margin-left:0;}


body{display:block;width:380px;max-height:560px;overflow-y:auto;height:auto;}
header{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:5;}
header .brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;white-space:nowrap;}
header .brand .ic{color:var(--accent);}
header .spacer{flex:1;}
button{font-family:inherit;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--border-strong);background:transparent;color:var(--text);border-radius:16px;cursor:pointer;white-space:nowrap;}
button:hover{background:color-mix(in srgb,var(--text) 6%,transparent);}
button.icon{width:32px;padding:0;justify-content:center;}
button.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;}
button:disabled{opacity:.38;cursor:default;}
#status{padding:8px 16px;font-size:13px;color:var(--text);background:var(--accent-tint);display:none;}
#status.show{display:block;}
#lastSync{padding:8px 16px 0;font-size:12px;color:var(--text-dim);}
#list{padding:4px 0 8px;}
.day-group{margin-bottom:4px;}
.day-head{font-size:11px;font-weight:500;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;padding:12px 16px 4px;}
.ev{display:flex;gap:12px;padding:8px 16px;align-items:flex-start;}
.ev:hover{background:var(--surface-2);}
.ev .stripe{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.ev .time{font-size:13px;color:var(--text);min-width:96px;}
.ev .info{flex:1;min-width:0;}
.ev .title{font-size:14px;font-weight:500;}
.ev .meta{font-size:12px;color:var(--text-dim);margin-top:1px;}
.empty{text-align:center;padding:40px 16px;color:var(--text-dim);font-size:14px;}
.empty .big{display:flex;justify-content:center;margin-bottom:8px;color:var(--border-strong);}
.empty .big .ic{width:44px;height:44px;stroke-width:1.2;}
#disclaimer .link-btn{border:none;background:none;padding:0;height:auto;font-size:12px;font-weight:400;color:var(--link);cursor:pointer;display:inline;}
#disclaimer .link-btn:hover{text-decoration:underline;background:none;}
#disclaimer{padding:8px 16px;font-size:12px;color:var(--text-dim);text-align:center;border-top:1px solid var(--border);}
.ev.past .time,.ev.past .title{color:var(--text-dim);}
.ev.past .stripe{opacity:.45;}
.ev.current{background:var(--accent-tint);}
.ev-state{display:block;font-size:11px;font-weight:500;color:var(--accent);margin-top:2px;}

/* ---------- color pass ---------- */
.brand-mark-color{background:linear-gradient(135deg,#0b57d0,#8e24aa);}
.fab{background:linear-gradient(135deg,#0b57d0,#1a73e8);color:#fff;}
.fab:hover{background:linear-gradient(135deg,#0a4dbb,#1967d2);}
.fab.expired{background:linear-gradient(135deg,#b3261e,#c5221f);color:#fff;}
.sticker{width:96px;height:96px;}
.empty-state .big{color:inherit;}
.cd-unit{position:relative;overflow:hidden;}
.cd-unit::before{content:"";position:absolute;inset:0;opacity:.5;}
.cd-unit:nth-of-type(4n+1)::before{background:linear-gradient(180deg,#ecf3fe,transparent 70%);}
.cd-unit:nth-of-type(4n+2)::before{background:linear-gradient(180deg,#e6f4ea,transparent 70%);}
.cd-unit:nth-of-type(4n+3)::before{background:linear-gradient(180deg,#fdf0e6,transparent 70%);}
.cd-unit:nth-of-type(4n+4)::before{background:linear-gradient(180deg,#fbe9ea,transparent 70%);}
.cd-unit .cd-num,.cd-unit .cd-lbl{position:relative;}
#ucaLoginBtn .ic,.mobile-menu .mi#ucaLoginBtn .ic{color:#8e24aa;}
.toast.ok{background:#0b8043;}
.hidden{display:none!important;}
button.danger{background:var(--danger-solid);color:#fff;border-color:transparent;}
#logoutBtn .ic{color:var(--danger);}
.modal-overlay{position:fixed;inset:0;background:rgba(32,33,36,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal-box{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-lg);width:300px;padding:16px;}
.modal-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:8px;}
.modal-title .ic{color:var(--danger);}
.modal-text{font-size:13px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;}
.session-expired{color:var(--danger);font-weight:700;}
.update-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;background:var(--accent-tint);color:var(--text);border-bottom:1px solid var(--border);}
.update-bar span{flex:1;}
.update-bar .ic{color:var(--accent);}
.chg-badge{display:inline-block;font-size:10px;font-weight:700;line-height:1.5;padding:0 6px;border-radius:8px;margin-right:5px;vertical-align:1px;color:#fff;}
.chg-added{background:#188038;} .chg-moved{background:#1a73e8;} .chg-room{background:#e37400;} .chg-cancelled{background:#d93025;}

/* ===== DESIGN CARNET (popup) ===== */
@font-face{font-family:"Caveat";src:url("fonts/caveat.ttf") format("truetype");font-weight:400 700;font-display:swap;}
@font-face{font-family:"Nunito";src:url("fonts/nunito.ttf") format("truetype");font-weight:200 1000;font-display:swap;}
:root{--hand:"Caveat","Segoe Print","Bradley Hand",cursive;--ink:#2f4fa2;--ink-red:#c0392b;--highlight:#ffe66d;}
body{background-color:var(--bg);background-image:linear-gradient(rgba(47,79,162,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(47,79,162,.07) 1px,transparent 1px);background-size:22px 22px;}
header{background:rgba(255,250,240,.95);border-bottom:2px dashed var(--border-strong);}
header{gap:4px;padding:8px 10px;}
header .brand{font-family:var(--hand);font-size:22px;font-weight:700;color:var(--ink);gap:5px;}
header button{padding:0 10px;}
header button.icon{padding:0;}
header .brand .ic{color:var(--ink-red);}
button{border:1.5px solid var(--border-strong);background:var(--surface);border-radius:10px 12px 10px 13px;font-weight:700;}
button:hover{background:#fff6dc;border-color:var(--ink);}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:2px 2px 0 var(--highlight);}
#status{background:#fff6dc;}
#lastSync{font-style:italic;}
.day-head{font-family:var(--hand);font-size:21px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink);}
.ev{margin:0 10px 8px;padding:9px 12px;background:#fffaf0;border:1px solid var(--border);border-radius:3px 3px 12px 3px;box-shadow:0 2px 4px rgba(80,60,20,.1);}
.ev:hover{background:#fff6dc;}
.ev .stripe{width:12px;height:12px;border-radius:3px;transform:rotate(8deg);}
.ev .time{font-weight:700;color:var(--ink);}
.ev .title{font-weight:800;}
.ev.current{background:#fff6dc;border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink);}
.ev-state{color:var(--ink-red);font-family:var(--hand);font-size:17px;}
#disclaimer{background:rgba(255,250,240,.9);}
.modal-box{background:#fffaf0;border:1.5px solid var(--border-strong);border-radius:6px 6px 18px 6px;}
.modal-title{font-family:var(--hand);font-size:24px;color:var(--ink);}
.update-bar{background:#fff6dc;}
.ic{filter:url(#sketch);}
</style>
</head>

 id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16M7 16.5v-5M12 16.5v-9M17 16.5v-3"/></symbol><symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5h10.5a2 2 0 0 1 2 2V20H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h10.5"/></symbol><symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.6 7-5.6s6.2 2 7 5.6"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-6.5-6.1-6.5-11a6.5 6.5 0 0 1 13 0c0 4.9-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M5 4.5h14v11l-4.5 4.5H5z"/><path d="M14.5 20v-4.5H19M8.5 9h7M8.5 12.5h4"/></symbol><symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.2v.1"/></symbol><symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16.5 6.5l2.5 2.5M14 9l2 2"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol><symbol id="i-merge" viewBox="0 0 24 24"><path d="M7 4v5a5 5 0 0 0 5 5h5M7 20v-6M14 11l3 3-3 3"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 6.5a2 2 0 0 1 2-2h4l2 2.5h7a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol><symbol id="i-save" viewBox="0 0 24 24"><path d="M5 4.5h11l3.5 3.5v11.5H5z"/><path d="M8.5 4.5v5h6v-5M8.5 19.5v-5h7v5"/></symbol><symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol><symbol id="i-logout" viewBox="0 0 24 24"><path d="M15 4.5h3.5a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H15"/><path d="M11 8l-4 4 4 4"/><path d="M7 12h10.5"/></symbol><symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2.4M12 18.1v2.4M20.5 12h-2.   <svg class="ic sm" aria-hidden="true"><use href="#i-download"/></svg>
