<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t">
<title id="t">Design Carnet</title>
<style>
.page{transform-box:fill-box;transform-origin:center;animation:sway 6s ease-in-out infinite}
.pen{transform-box:fill-box;transform-origin:20% 90%;animation:write 3.2s ease-in-out infinite}
.ink{stroke-dasharray:60;stroke-dashoffset:60;animation:ink 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-1deg)}}
@keyframes write{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(9px,-2px) rotate(6deg)}}
@keyframes ink{0%{stroke-dashoffset:60}55%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:60}}
@media (prefers-reduced-motion:reduce){.page,.pen{animation:none}.ink{animation:none;stroke-dashoffset:0}}
</style>
<g class="page">
<path d="M17 14c10-2 44-3 62 0 3 20 2 48 0 68-18 3-52 2-62 0-2-22-2-46 0-68z" fill="#fffaf0" stroke="#c9b68f" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M26 28c14-1 30-1 44 0M26 40c14 1 31 0 44 1M26 52c13-1 30 0 44 0M26 64c14 1 28 0 44 0" fill="none" stroke="#e2d5b8" stroke-width="1.6" stroke-linecap="round"/>
<path class="ink" d="M28 34c6-9 9 4 14-3s6 6 11-1 8 4 14-2" fill="none" stroke="#2f4fa2" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="none" stroke="#6e6658" stroke-width="2.4" stroke-linecap="round"><path d="M17 22c-4-1-5 4-1 5"/><path d="M17 38c-4-1-5 4-1 5"/><path d="M17 54c-4-1-5 4-1 5"/><path d="M17 70c-4-1-5 4-1 5"/></g>
<path d="M60 13c1-4 12-4 13 0v8c-4 1-9 1-13 0z" fill="#f3d36b" stroke="#c9a22f" stroke-width="1.6" stroke-linejoin="round" opacity=".95"/>
<g class="pen"><path d="M58 70l17-19 6 5-17 19-8 3z" fill="#e8795c" stroke="#8c3b27" stroke-width="2" stroke-linejoin="round"/><path d="M58 70l-1.5 8 8-3z" fill="#f3e2c1" stroke="#8c3b27" stroke-width="1.6" stroke-linejoin="round"/></g>
</g>
</svg>
