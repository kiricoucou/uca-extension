<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t">
<title id="t">Design Professionnel</title>
<style>
.tick{stroke-dasharray:42;stroke-dashoffset:42;animation:draw 4s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow 4s ease-in-out infinite}
.b2{animation-delay:.25s}.b3{animation-delay:.5s}
@keyframes draw{0%,12%{stroke-dashoffset:42}38%,82%{stroke-dashoffset:0}100%{stroke-dashoffset:42}}
@keyframes grow{0%,10%{transform:scaleY(.2)}40%,85%{transform:scaleY(1)}100%{transform:scaleY(.2)}}
@media (prefers-reduced-motion:reduce){.tick{animation:none;stroke-dashoffset:0}.bar{animation:none}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f78e6"/><stop offset="1" stop-color="#0b57d0"/></linearGradient></defs>
<rect x="6" y="6" width="84" height="84" rx="20" fill="url(#g)"/>
<rect x="21" y="23" width="54" height="50" rx="8" fill="#fff"/>
<rect x="21" y="23" width="54" height="13" rx="8" fill="#d3e3fd"/>
<rect x="21" y="30" width="54" height="6" fill="#d3e3fd"/>
<g fill="#0b57d0"><rect class="bar" x="30" y="52" width="8" height="14" rx="2"/><rect class="bar b2" x="44" y="46" width="8" height="20" rx="2"/><rect class="bar b3" x="58" y="40" width="8" height="26" rx="2"/></g>
<path class="tick" d="M30 30l5 5 9-10" fill="none" stroke="#0b57d0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -1)"/>
</svg>
