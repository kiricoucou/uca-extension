<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="t">
<title id="t">Design Studio</title>
<style>
.c1{animation:f1 5s ease-in-out infinite}
.c2{animation:f2 5s ease-in-out infinite}
.c3{animation:f3 5s ease-in-out infinite}
.dot{transform-box:fill-box;transform-origin:center;animation:bl 3.4s ease-in-out infinite}
@keyframes f1{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(1px,-3px) rotate(-2deg)}}
@keyframes f2{0%,100%{transform:translate(0,0) rotate(3deg)}50%{transform:translate(-1px,3px) rotate(5deg)}}
@keyframes f3{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,-2px)}}
@keyframes bl{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){.c1,.c2,.c3,.dot{animation:none}}
</style>
